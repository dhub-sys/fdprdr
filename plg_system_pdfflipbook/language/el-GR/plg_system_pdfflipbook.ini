PLG_SYSTEM_PDFFLIPBOOK="System - PDF Flipbook"
PLG_SYSTEM_PDFFLIPBOOK_XML_DESCRIPTION="Προβάλλει αρχεία PDF σαν έντυπο που ξεφυλλίζεται. Προσθέτει το element <strong>PDF Flipbook</strong> στον builder του YOOtheme Pro (ασφαλές στις ενημερώσεις) και το shortcode <code>{pdfflipbook src=&quot;images/file.pdf&quot;}</code>."
